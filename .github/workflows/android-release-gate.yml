name: Android Release Gate

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Static source checks
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nexvary/library/MainActivity.java
          grep -q 'مكتبة القدس الجديدة' app/src/main/java/com/nexvary/library/MainActivity.java
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Run lint
        run: gradle --no-daemon lintDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlQuds-New-Library-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
