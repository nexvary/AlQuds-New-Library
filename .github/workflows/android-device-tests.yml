name: Android Device Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-devices-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  database:
    name: Catalog and Arabic search (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/org.alquds.library/files/visual-review visual-review
            python3 tests/run_process_restart.py
      - name: Upload visual review
        uses: actions/upload-artifact@v4
        with:
          name: AlQuds-visual-review-api-${{ matrix.api }}
          path: visual-review/*.png
          if-no-files-found: error
      - name: Publish test counts to job summary
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not reports:
                  summary.write('No device test results were produced. Check emulator/build logs.\n')
              for report in reports:
                  suite = ET.parse(report).getroot()
                  summary.write(f"{suite.get('name')}: tests={suite.get('tests')}, failures={suite.get('failures')}, errors={suite.get('errors')}\n")
          PY
